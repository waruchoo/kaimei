<!DOCTYPE html>
<html lang="ja" class="w-full h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たのしい！ごせんふ ドレミマスター</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- VexFlow -->

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 汎用アニメーション */
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-short {
            animation: bounce-short 0.4s ease-in-out infinite;
        }

        /* 正解時の鍵盤ハイライト */
        .key-highlight {
            background-color: #fef08a !important;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.8) inset;
            transition: background-color 0.1s ease;
        }

        /* ボタンの押し込みエフェクト */
        .btn-press {
            transition: transform 0.1s ease;
        }
        .btn-press:active {
            transform: scale(0.95);
        }

        /* 隠しカーテンのトランジション */
        .curtain-overlay {
            transition: opacity 0.3s ease-in-out;
        }

        /* 五線譜SVGのレスポンシブ対応 */
        #staffContainer svg {
            width: 100%;
            height: 100%;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 w-full h-[100dvh] flex flex-col m-0 p-0 overflow-hidden selection:bg-pink-200">

    <!-- 全体を囲むラッパー（スケール計算用） -->

                        <button onclick="toggleMute()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold px-3 py-1.5 rounded-full border-2 border-amber-500 text-xs flex items-center gap-1 transition btn-press">

            </header>

            <main class="flex-grow flex items-center justify-center p-3 w-full h-full relative box-border pb-8">

                    <!-- 1. タイトル画面 -->

                    <!-- 2. ゲームプレイ画面 -->
                    <div id="screenGame" class="hidden absolute inset-0 bg-white rounded-2xl p-2 shadow-xl border-4 border-amber-300 flex flex-col gap-2">
                        
                        <div class="flex justify-between items-center bg-amber-100/70 p-2 rounded-xl border-2 border-amber-200 shrink-0">

                        <div class="flex-grow flex flex-row gap-2 min-h-0">

                                <!-- 五線譜コンテナ -->

                                        <button onclick="submitAnswer('ラ')" class="w-14 bg-blue-500 hover:bg-blue-600 text-white font-black py-1.5 rounded-lg text-sm border-2 border-blue-400 btn-press">ラ</button>
                                        <button onclick="submitAnswer('シ')" class="w-14 bg-purple-500 hover:bg-purple-600 text-white font-black py-1.5 rounded-lg text-sm border-2 border-purple-400 btn-press">シ</button>

                    </div>

                    <!-- 3. 結果画面 -->
                    <div id="screenResult" class="hidden absolute inset-0 bg-white rounded-2xl p-3 shadow-xl border-4 border-amber-300 flex flex-col items-center justify-center space-y-3 z-10">
                        <div class="text-center space-y-0.5">

                        <div class="bg-amber-50 rounded-2xl py-1.5 px-4 border-2 border-amber-200 w-full max-w-sm space-y-1">

                            </div>

                        <div class="space-y-2 w-full max-w-sm flex flex-col items-center">
                            <!-- 隠しモード：スペシャルモードへ行くボタン -->
                            <button id="specialModeBtn" onclick="startGame(true)" class="hidden w-full py-2 bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600 text-white font-black text-base rounded-2xl shadow-[0_4px_0_0_#4338ca] btn-press">
                                🔥 30びょう タイムアタックに ちょうせん！
                            </button>
                            <button id="nextLevelBtn" onclick="nextLevel()" class="hidden w-full py-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-black text-base rounded-2xl shadow-[0_4px_0_0_#047857] btn-press">
                                つぎの レベルヘ すすむ！ 🚀
                            </button>
                            <button onclick="startGame(false)" class="w-full py-2 bg-amber-400 hover:bg-amber-500 text-amber-950 font-black text-base rounded-2xl shadow-[0_4px_0_0_#b45309] btn-press">
                                もう一度 このレベルで あそぶ 🔄

                    </div>

            </main>

            <!-- フッター -->
            <footer class="absolute bottom-1 w-full text-center text-[9px] text-amber-800/50 font-bold z-20 pointer-events-none">
                &copy; 2026 Takuma Iwahara. Released under the MIT License.
            </footer>

        </div> <!-- /#gameApp -->
    </div> <!-- /#gameWrapper -->

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                // 全音域をカバーする周波数定義 (C2〜C6)
                this.noteFreqs = {
                    'C2': 65.41, 'D2': 73.42, 'E2': 82.41, 'F2': 87.31, 'G2': 98.00, 'A2': 110.00, 'B2': 123.47,
                    'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
                    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
                    'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77,
                    'C6': 1046.50
                };
            }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playDummySound() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                gain.gain.value = 0; 
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.01);
            }
            playNote(pitchName) {
                if (this.isMuted) return;
                this.init();
                const freq = this.noteFreqs[pitchName] || 440;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.exponentialRampToValueAtTime(0.4, now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.8);
            }
            playCorrect() {
                if (this.isMuted) return;
                this.init();
                const now = this.ctx.currentTime;
                const playTone = (freq, delay, duration) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + delay);
                    gain.gain.setValueAtTime(0.063, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + duration);
                };
                playTone(659.25, 0, 0.25);
                playTone(880.00, 0.15, 0.4);
            }
            playWrong() {
                if (this.isMuted) return;
                this.init();
                const now = this.ctx.currentTime;
                const playTone = (freq, delay) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + delay);
                    gain.gain.setValueAtTime(0.07, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.25);
                };
                playTone(180, 0);
                playTone(140, 0.15);
            }
            playFanfare() {
                if (this.isMuted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [{f:523.25, d:0, l:0.12}, {f:659.25, d:0.12, l:0.12}, {f:783.99, d:0.24, l:0.12}, {f:1046.50, d:0.36, l:0.5}];
                notes.forEach(n => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(n.f, now + n.d);
                    gain.gain.setValueAtTime(0.35, now + n.d);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + n.d + n.l);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + n.d);
                    osc.stop(now + n.d + n.l);
                });
            }
        }
        const sound = new SoundEngine();

        const LEVEL_CONFIGS = {
            1: { time: null, label: 'みほうだい' },
            2: { time: 10, label: '10びょう' },
            3: { time: 5, label: '5びょう' },
            4: { time: 2, label: '2びょう' },
            5: { time: 1, label: '1びょう' }
        };

        // 鍵盤描画のためのデータ (白鍵のリストと、右側に黒鍵がある白鍵のインデックス)
        const CLEF_CONFIG = {
            'treble': {
                whiteKeys: ['A3', 'B3', 'C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F5', 'G5', 'A5', 'B5', 'C6'],
                blackKeys: [1, 3, 4, 6, 7, 8, 10, 11, 13, 14, 15], // 1-based (A, C, D, F, G, A... の右)
                hasRightHalfBlackKey: true // C6の右(C#)を見切れさせる
            },
            'bass': {
                whiteKeys: ['C2', 'D2', 'E2', 'F2', 'G2', 'A2', 'B2', 'C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4', 'D4', 'E4'],
                blackKeys: [1, 2, 4, 5, 6, 8, 9, 11, 12, 13, 15, 16], // 1-based (C, D, F, G, A... の右)
                hasRightHalfBlackKey: false // E4の右はFなので黒鍵なし
            }
        };

        // ト音記号の問題リスト (A3〜C6)
        const NOTE_LIST_TREBLE = [
            { name: 'ラ', pitchName: 'A3', vexKey: 'a/3', stemUp: true, keyId: 'key_A3' },
            { name: 'シ', pitchName: 'B3', vexKey: 'b/3', stemUp: true, keyId: 'key_B3' },
            { name: 'ド', pitchName: 'C4', vexKey: 'c/4', stemUp: true, keyId: 'key_C4' },
            { name: 'レ', pitchName: 'D4', vexKey: 'd/4', stemUp: true, keyId: 'key_D4' },
            { name: 'ミ', pitchName: 'E4', vexKey: 'e/4', stemUp: true, keyId: 'key_E4' },
            { name: 'ファ', pitchName: 'F4', vexKey: 'f/4', stemUp: true, keyId: 'key_F4' },
            { name: 'ソ', pitchName: 'G4', vexKey: 'g/4', stemUp: true, keyId: 'key_G4' },
            { name: 'ラ', pitchName: 'A4', vexKey: 'a/4', stemUp: true, keyId: 'key_A4' },
            { name: 'シ', pitchName: 'B4', vexKey: 'b/4', stemUp: false, keyId: 'key_B4' },
            { name: 'ド', pitchName: 'C5', vexKey: 'c/5', stemUp: false, keyId: 'key_C5' },
            { name: 'レ', pitchName: 'D5', vexKey: 'd/5', stemUp: false, keyId: 'key_D5' },
            { name: 'ミ', pitchName: 'E5', vexKey: 'e/5', stemUp: false, keyId: 'key_E5' },
            { name: 'ファ', pitchName: 'F5', vexKey: 'f/5', stemUp: false, keyId: 'key_F5' },
            { name: 'ソ', pitchName: 'G5', vexKey: 'g/5', stemUp: false, keyId: 'key_G5' },
            { name: 'ラ', pitchName: 'A5', vexKey: 'a/5', stemUp: false, keyId: 'key_A5' },
            { name: 'シ', pitchName: 'B5', vexKey: 'b/5', stemUp: false, keyId: 'key_B5' },
            { name: 'ド', pitchName: 'C6', vexKey: 'c/6', stemUp: false, keyId: 'key_C6' }
        ];

        // ヘ音記号の問題リスト (C2〜E4)
        const NOTE_LIST_BASS = [
            { name: 'ド', pitchName: 'C2', vexKey: 'c/2', stemUp: true, keyId: 'key_C2' },
            { name: 'レ', pitchName: 'D2', vexKey: 'd/2', stemUp: true, keyId: 'key_D2' },
            { name: 'ミ', pitchName: 'E2', vexKey: 'e/2', stemUp: true, keyId: 'key_E2' },
            { name: 'ファ', pitchName: 'F2', vexKey: 'f/2', stemUp: true, keyId: 'key_F2' },
            { name: 'ソ', pitchName: 'G2', vexKey: 'g/2', stemUp: true, keyId: 'key_G2' },
            { name: 'ラ', pitchName: 'A2', vexKey: 'a/2', stemUp: true, keyId: 'key_A2' },
            { name: 'シ', pitchName: 'B2', vexKey: 'b/2', stemUp: true, keyId: 'key_B2' },
            { name: 'ド', pitchName: 'C3', vexKey: 'c/3', stemUp: true, keyId: 'key_C3' },
            { name: 'レ', pitchName: 'D3', vexKey: 'd/3', stemUp: false, keyId: 'key_D3' },
            { name: 'ミ', pitchName: 'E3', vexKey: 'e/3', stemUp: false, keyId: 'key_E3' },
            { name: 'ファ', pitchName: 'F3', vexKey: 'f/3', stemUp: false, keyId: 'key_F3' },
            { name: 'ソ', pitchName: 'G3', vexKey: 'g/3', stemUp: false, keyId: 'key_G3' },
            { name: 'ラ', pitchName: 'A3', vexKey: 'a/3', stemUp: false, keyId: 'key_A3' },
            { name: 'シ', pitchName: 'B3', vexKey: 'b/3', stemUp: false, keyId: 'key_B3' },
            { name: 'ド', pitchName: 'C4', vexKey: 'c/4', stemUp: false, keyId: 'key_C4' },
            { name: 'レ', pitchName: 'D4', vexKey: 'd/4', stemUp: false, keyId: 'key_D4' },
            { name: 'ミ', pitchName: 'E4', vexKey: 'e/4', stemUp: false, keyId: 'key_E4' }
        ];

        let currentLevel = 1;
        let questionIndex = 0;
        let score = 0;
        let currentNote = null;
        let isAnsweringAllowed = false;
        let timerInterval = null;
        let questionSequence = [];
        let isSpecialMode = false;
        let currentClef = 'treble'; // デフォルトはト音記号

        function adjustScale() {
            const wrapper = document.getElementById('gameWrapper');
            const app = document.getElementById('gameApp');
            if (!wrapper || !app) return;
            
            const wrapperWidth = wrapper.clientWidth;
            const wrapperHeight = wrapper.clientHeight;
            
            const appWidth = 640;
            const appHeight = 480;
            
            const scale = Math.min(wrapperWidth / appWidth, wrapperHeight / appHeight) * 0.98;
            app.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', adjustScale);

        window.addEventListener('DOMContentLoaded', () => {
            adjustScale();
            buildLevelSelectButtons();
            selectClef('treble'); // 初期記号選択
            showTitle();
        });

        function toggleMute() {
            sound.isMuted = !sound.isMuted;
            document.getElementById('soundIcon').textContent = sound.isMuted ? '🔇' : '🔊';
            document.getElementById('soundLabel').textContent = sound.isMuted ? 'おと OFF' : 'おと ON';
        }

        function selectClef(clef) {
            currentClef = clef;
            const btnTreble = document.getElementById('btnClef_treble');
            const btnBass = document.getElementById('btnClef_bass');
            
            const activeClass = 'flex-1 py-2 rounded-xl font-black text-sm border-2 transition bg-amber-400 border-amber-600 text-amber-950 shadow-md scale-105 btn-press';
            const inactiveClass = 'flex-1 py-2 rounded-xl font-black text-sm border-2 transition bg-white border-slate-200 text-slate-600 hover:border-amber-300 hover:bg-amber-50 btn-press';
            
            if (clef === 'treble') {
                btnTreble.className = activeClass;
                btnBass.className = inactiveClass;
            } else {
                btnBass.className = activeClass;
                btnTreble.className = inactiveClass;
            }
        }

        function buildLevelSelectButtons() {
            const container = document.getElementById('levelSelectContainer');
            container.innerHTML = '';
            for (let lvl = 1; lvl <= 5; lvl++) {
                const btn = document.createElement('button');
                btn.onclick = () => selectLevel(lvl);
                btn.id = `lvlBtn_${lvl}`;
                btn.innerHTML = `<span class="text-[10px] font-bold text-slate-400">Lv.${lvl}</span><span class="text-[9px]">${LEVEL_CONFIGS[lvl].label}</span>`;
                container.appendChild(btn);
            }
            selectLevel(currentLevel);
        }

        function selectLevel(lvl) {
            currentLevel = lvl;
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`lvlBtn_${i}`);
                if (i === lvl) {
                    btn.className = 'py-2 px-1 rounded-2xl font-black text-sm border-2 transition flex flex-col items-center justify-center bg-amber-400 border-amber-600 text-amber-950 shadow-md scale-105 btn-press';
                } else {
                    btn.className = 'py-2 px-1 rounded-2xl font-black text-sm border-2 transition flex flex-col items-center justify-center bg-white border-slate-200 text-slate-600 hover:border-amber-300 hover:bg-amber-50 btn-press';
                }
            }
        }

        function showTitle() {
            clearInterval(timerInterval);
            document.getElementById('screenTitle').classList.remove('hidden');
            document.getElementById('screenGame').classList.add('hidden');
            document.getElementById('screenResult').classList.add('hidden');
            document.getElementById('headerTitleBtn').classList.add('hidden');
        }

        function renderKeyboard(clef) {
            const whiteContainer = document.getElementById('whiteKeysContainer');
            const blackContainer = document.getElementById('blackKeysContainer');
            whiteContainer.innerHTML = '';
            blackContainer.innerHTML = '';
            
            const config = CLEF_CONFIG[clef];
            const numKeys = config.whiteKeys.length;
            
            // 白鍵の描画
            config.whiteKeys.forEach((keyIdStr) => {
                const div = document.createElement('div');
                div.id = `key_${keyIdStr}`;
                div.className = 'flex-1 bg-white flex items-end justify-center transition-colors';
                
                // ピアノの基準となる「中央のド（C4）」にのみ目印をつける
                if (keyIdStr === 'C4') {
                    const dot = document.createElement('div');
                    dot.className = 'w-1.5 h-1.5 bg-slate-400 rounded-full mb-2';
                    div.appendChild(dot);
                }
                whiteContainer.appendChild(div);
            });
            
            // 黒鍵の描画
            config.blackKeys.forEach(whiteIndex => {
                const div = document.createElement('div');
                div.className = 'absolute top-0 h-[55%] bg-slate-900 shadow-sm rounded-b-sm';
                div.style.left = `calc((100% / ${numKeys}) * ${whiteIndex} - 1.5%)`;
                div.style.width = '3%';
                blackContainer.appendChild(div);
            });
            
            // 右端の半分の黒鍵（必要な場合）
            if (config.hasRightHalfBlackKey) {
                const div = document.createElement('div');
                div.className = 'absolute top-0 h-[55%] bg-slate-900 shadow-sm rounded-bl-sm';
                div.style.left = `calc(100% - 1.5%)`;
                div.style.width = '3%';
                blackContainer.appendChild(div);
            }
        }

        function startGame(startSpecial = false) {
            sound.playDummySound(); // ゲーム開始時に無音を鳴らして音声をアンロック
            isSpecialMode = startSpecial;
            questionIndex = 0;
            score = 0;
            
            document.getElementById('screenTitle').classList.add('hidden');
            document.getElementById('screenResult').classList.add('hidden');
            document.getElementById('screenGame').classList.remove('hidden');
            document.getElementById('headerTitleBtn').classList.add('hidden'); // ゲーム中は非表示
            
            // 鍵盤を描画
            renderKeyboard(currentClef);
            
            const activeNoteList = currentClef === 'treble' ? NOTE_LIST_TREBLE : NOTE_LIST_BASS;
            
            const badge = document.getElementById('currentLevelBadge');
            const qIndexContainer = document.getElementById('qIndexContainer');
            const scoreLabel = document.getElementById('scoreLabel');
            const scoreUnit = document.getElementById('scoreUnit');

            if (isSpecialMode) {
                badge.textContent = 'タイムアタック';
                badge.className = 'bg-purple-600 text-white font-black px-2 py-1 rounded-lg text-xs shadow';
                qIndexContainer.classList.add('hidden');
                scoreLabel.textContent = 'せいかい';
                scoreUnit.textContent = '問';
                
                // スペシャルモード用に全音符をシャッフルした「山札」を作成
                questionSequence = [...activeNoteList].sort(() => Math.random() - 0.5);

                startSpecialTimer(); // スペシャル用の30秒タイマー開始
            } else {
                badge.textContent = `レベル ${currentLevel}`;
                badge.className = 'bg-pink-500 text-white font-black px-2 py-1 rounded-lg text-xs shadow';
                qIndexContainer.classList.remove('hidden');
                scoreLabel.textContent = 'てんすう';
                scoreUnit.textContent = '点';
                
                // 選ばれた記号のリストから、ランダムに10個を重複なしで選ぶ
                const shuffledNotes = [...activeNoteList].sort(() => Math.random() - 0.5);
                questionSequence = shuffledNotes.slice(0, 10);
            }

            nextQuestion();
        }

        function drawStaffAndNote(note) {
            const container = document.getElementById('staffContainer');
            container.innerHTML = '';
            if (typeof Vex === 'undefined') return;
            const VF = Vex.Flow;
            
            const LOGICAL_WIDTH = 120;
            const LOGICAL_HEIGHT = 160;
            
            const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
            renderer.resize(LOGICAL_WIDTH, LOGICAL_HEIGHT);
            const context = renderer.getContext();

            const stave = new VF.Stave(5, 15, 110);
            stave.addClef(currentClef); // ト音記号またはヘ音記号を描画
            stave.setContext(context).draw();

            const staveNote = new VF.StaveNote({
                clef: currentClef,
                keys: [note.vexKey],
                duration: "q",
                stem_direction: note.stemUp ? 1 : -1
            });

            const voice = new VF.Voice({ num_beats: 1, beat_value: 4 });
            voice.addTickable(staveNote);
            new VF.Formatter().joinVoices([voice]).format([voice], 40);
            voice.draw(context, stave);

            const svg = container.querySelector('svg');
            if (svg) {
                svg.setAttribute('viewBox', `0 0 ${LOGICAL_WIDTH} ${LOGICAL_HEIGHT}`);
                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                svg.style.width = '100%';
                svg.style.height = '100%';
                svg.style.overflow = 'visible';
                svg.style.transform = 'scale(1.5)';
                svg.style.transformOrigin = 'center center';
            }
        }

        function nextQuestion() {
            if (!isSpecialMode) {
                questionIndex++;
                if (questionIndex > 10) { endGame(); return; }
                document.getElementById('qIndexText').textContent = questionIndex;
                currentNote = questionSequence[questionIndex - 1];
            } else {
                // スペシャルモード：山札から順番に引き、無くなったら新しくシャッフルし直す
                if (questionIndex >= questionSequence.length) {
                    const activeNoteList = currentClef === 'treble' ? NOTE_LIST_TREBLE : NOTE_LIST_BASS;
                    questionSequence = [...activeNoteList].sort(() => Math.random() - 0.5);
                    questionIndex = 0;
                }
                currentNote = questionSequence[questionIndex];
                questionIndex++;
            }

            document.getElementById('scoreText').textContent = score;
            document.getElementById('curtainOverlay').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('feedbackOverlay').classList.add('opacity-0', 'scale-50');
            document.querySelectorAll('.key-highlight').forEach(el => el.classList.remove('key-highlight'));

            drawStaffAndNote(currentNote);
            isAnsweringAllowed = true;
            
            if (!isSpecialMode) startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            const bar = document.getElementById('timerProgressBar');
            const conf = LEVEL_CONFIGS[currentLevel];
            
            if (!conf.time) {
                bar.style.width = '100%';
                bar.className = 'bg-emerald-400 h-full w-full';
                return;
            }

            const totalMs = conf.time * 1000;
            const start = Date.now();
            bar.className = 'bg-emerald-400 h-full w-full';

            timerInterval = setInterval(() => {
                const remaining = Math.max(0, totalMs - (Date.now() - start));
                const pct = (remaining / totalMs) * 100;
                bar.style.width = `${pct}%`;
                if (pct < 30) bar.className = 'bg-rose-500 h-full w-full';
                else if (pct < 60) bar.className = 'bg-amber-400 h-full w-full';

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('curtainOverlay').classList.remove('opacity-0', 'pointer-events-none');
                }
            }, 50);
        }

        function startSpecialTimer() {
            clearInterval(timerInterval);
            const bar = document.getElementById('timerProgressBar');
            const totalMs = 30 * 1000; // 30秒
            const start = Date.now();
            bar.className = 'bg-purple-400 h-full w-full';

            timerInterval = setInterval(() => {
                const remaining = Math.max(0, totalMs - (Date.now() - start));
                const pct = (remaining / totalMs) * 100;
                bar.style.width = `${pct}%`;
                if (pct < 30) bar.className = 'bg-rose-500 h-full w-full';
                else if (pct < 60) bar.className = 'bg-amber-400 h-full w-full';

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    isAnsweringAllowed = false;
                    endGame();
                }
            }, 50);
        }

        function submitAnswer(selectedName) {
            if (!isAnsweringAllowed) return;
            if (!isSpecialMode) clearInterval(timerInterval); // スペシャルモードの時はタイマーを止めない
            isAnsweringAllowed = false;

            sound.playNote(currentNote.pitchName);
            
            setTimeout(() => {
                const isCorrect = (selectedName === currentNote.name);
                const fbOverlay = document.getElementById('feedbackOverlay');
                const fbCircle = document.getElementById('feedbackCircle');

                if (currentNote.keyId) {
                    const keyEl = document.getElementById(currentNote.keyId);
                    if (keyEl) keyEl.classList.add('key-highlight');
                }

                if (isCorrect) {
                    score += isSpecialMode ? 1 : 10;
                    sound.playCorrect();
                    fbCircle.textContent = '◯';
                    fbCircle.className = 'w-20 h-20 rounded-full flex items-center justify-center text-white text-5xl font-black shadow-xl bg-emerald-500/90 border-4 border-white animate-bounce-short';
                } else {
                    sound.playWrong();
                    fbCircle.textContent = '✕';
                    fbCircle.className = 'w-20 h-20 rounded-full flex items-center justify-center text-white text-5xl font-black shadow-xl bg-rose-500/90 border-4 border-white';
                }

                document.getElementById('scoreText').textContent = score;

                fbOverlay.classList.remove('opacity-0', 'scale-50');
                fbOverlay.classList.add('opacity-100', 'scale-100');

                setTimeout(() => {
                    fbOverlay.classList.remove('opacity-100', 'scale-100');
                    fbOverlay.classList.add('opacity-0', 'scale-50');
                    // スペシャルモードで時間切れになっていなければ次へ
                    if (isSpecialMode && !isAnsweringAllowed && timerInterval) {
                       setTimeout(() => nextQuestion(), 100);
                    } else if (!isSpecialMode) {
                       setTimeout(() => nextQuestion(), 200);
                    }
                }, 500); // テンポ良くするためにフィードバック時間を短縮

            }, 250);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('screenGame').classList.add('hidden');
            document.getElementById('screenResult').classList.remove('hidden');
            document.getElementById('headerTitleBtn').classList.remove('hidden'); // 結果画面でホームボタンを表示

            const emojiEl = document.getElementById('resultEmoji');
            const titleEl = document.getElementById('resultTitle');
            const subEl = document.getElementById('resultSub');
            const nextBtn = document.getElementById('nextLevelBtn');
            const specialBtn = document.getElementById('specialModeBtn');

            // ボタンは一旦隠す
            nextBtn.classList.add('hidden');
            specialBtn.classList.add('hidden');

            if (isSpecialMode) {
                document.getElementById('resultLevelText').textContent = 'スペシャルモード';
                document.getElementById('finalScoreText').textContent = `${score} 問`;
                
                emojiEl.textContent = score >= 15 ? '🔥' : '👍';
                titleEl.textContent = 'タイムアップ！';
                subEl.textContent = `${score}問も せいかい できたね！すごい！`;
                if (score >= 15) sound.playFanfare();
                
            } else {
                document.getElementById('resultLevelText').textContent = `レベル ${currentLevel}`;
                document.getElementById('finalScoreText').textContent = `${score} 点`;
                
                if (score === 100) {
                    emojiEl.textContent = '🎉';
                    titleEl.textContent = '100てん まんてん！';
                    subEl.textContent = 'すごい！ぜんぶ せいかいできたね！';
                    sound.playFanfare();
                    if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    
                    if (currentLevel < 5) {
                        nextBtn.classList.remove('hidden');
                    } else if (currentLevel === 5) {
                        specialBtn.classList.remove('hidden'); // レベル5満点クリアでスペシャルモード出現！
                    }
                } else {
                    emojiEl.textContent = score >= 70 ? '👏' : '🐥';
                    titleEl.textContent = `${score}てん！`;
                    subEl.textContent = score >= 70 ? 'あとすこしで まんてんだよ！' : 'もういちど たしかめて みよう！';
                }
            }
        }

        function nextLevel() {
            if (currentLevel < 5) selectLevel(currentLevel + 1);
            startGame(false);
        }
    </script>
</body>
</html>
